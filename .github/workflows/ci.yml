name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:   # release.yml runs the full CI before publishing
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    defaults: { run: { working-directory: gifty-backend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm, cache-dependency-path: gifty-backend/package-lock.json }
      - run: npm ci
      # .env.test is gitignored; CI supplies the same keys explicitly
      - run: npm test -- --ci
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/gifty-test
          JWT_SECRET: ci-jwt-secret
          JWT_EXPIRY: 1h
          REFRESH_TOKEN_SECRET: ci-refresh-secret
          REFRESH_TOKEN_EXPIRY: 7d
          JWT_COOKIE_EXPIRES_IN: 1
          REDIS_HOST: localhost
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: gifty-frontend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm, cache-dependency-path: gifty-frontend/package-lock.json }
      - run: npm ci
      - run: npm run test:ci
  image:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: gifty:dev
          build-args: GIFTY_VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: ./scripts/smoke-test.sh
