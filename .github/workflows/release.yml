name: Release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
jobs:
  ci:
    # Tests, image build and smoke test must pass for the tagged commit
    uses: ./.github/workflows/ci.yml
  publish:
    needs: ci
    runs-on: ubuntu-latest
    # A hang under QEMU fails the release in minutes instead of GitHub's 6-hour limit
    timeout-minutes: 45
    permissions:
      contents: write   # GitHub Release
      packages: write   # push to ghcr.io
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/gifty
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      # The arm64 image is built under QEMU and never tested in CI: build it alone first and
      # load every dependency on it, so a broken arm64 image never reaches the registry
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: gifty:arm64-check
          build-args: GIFTY_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: arm64 boot check
        timeout-minutes: 10
        # io_uring is a known cause of Node hanging under QEMU
        run: >-
          docker run --rm --platform linux/arm64 -e UV_USE_IO_URING=0 --entrypoint node gifty:arm64-check
          -e "const p=require('/app/package.json');for(const d of Object.keys(p.dependencies))require(d);console.log('arm64 ok')"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIFTY_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
